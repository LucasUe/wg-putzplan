name: Keepalive

# GitHub deaktiviert Cron-Workflows nach 60 Tagen ohne Repo-Aktivität.
# Dieser Workflow schreibt alle zwei Wochen einen Zeitstempel ins Repo und hält die
# Cron-Workflows (Erinnerungen, Keepalive selbst) aktiv.
on:
  schedule:
    - cron: '17 3 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zeitstempel schreiben und committen
        run: |
          date -u +%FT%TZ > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keepalive [skip ci]"
          git push

      - name: Cron-Workflows aktivieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in reminders.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/${wf}/enable" || true
          done
