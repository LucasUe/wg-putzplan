name: Putzplan-Erinnerungen

on:
  schedule:
    # stündlich zur Minute 5 (UTC); das Skript prüft die Berliner Uhrzeit
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Erinnerungen senden
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: npx tsx scripts/send-reminders.ts
