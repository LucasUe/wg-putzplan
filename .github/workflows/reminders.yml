name: Putzplan-Erinnerungen

on:
  schedule:
    # zweimal pro Stunde (UTC); fällig ist, was in den letzten 3 h (irische Zeit) anstand
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Erinnerungen senden
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: npx tsx scripts/send-reminders.ts
